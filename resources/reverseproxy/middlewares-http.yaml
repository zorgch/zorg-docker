# traefik Middlewares for HTTP routes
# - More information: https://community.traefik.io/t/middleware-does-not-exist-but-it-is-defined/19253/8
http:
  middlewares:

    # Enable compression
    # - Use with: compress-gzip@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/compress/
    compress-gzip:
      compress: {}

    # Add MIME-Type Autodetection
    # - Use with: contenttype-add@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/contenttype/
    contenttype-add:
      contenttype: {}

    # Add security headers
    # - Use with: securityheaders-add@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/headers/
    securityheaders-add:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        accessControlMaxAge: 100
        addVaryHeader: true
        customFrameOptionsValue: SAMEORIGIN
        customResponseHeaders:
          Access-Control-Allow-Origin: "*"
          Sec-Fetch-Site: cross-site
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    # Rate limiting
    # - Use with: rate-limit@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/ratelimit/
    rate-limit:
      rateLimit:
        average: 100
        period: 5s
        burst: 200

    # Allowed IP-Whitelist CIDRs
    # 💡 Format: "192.168.1.7/32", "152.23.5.0/16"
    # - Use with: ip-whitelist@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/ipallowlist/
    ip-whitelist:
      ipAllowList:
        sourceRange:
          # IPv4 - HOST
          - "127.0.0.1/32"   # localhost
          - "192.168.0.0/16" # local IPs (192.168.)
          - "172.16.0.0/12"  # Docker bridge networks (172.16-172.31)
          # IPv6 - HOST
          - "::1/128"        # localhost
          - "fe80::/10"      # Docker Link-local
          - "fd00::/8"       # Docker IPv6 default range
          # EXTERNAL HOSTS
          # - ".../32"

    # CrowdSec WAF (crowdsec-bouncer-traefik-plugin)
    # - Use with: crowdsec-waf@file
    # - 📖 Plugin docs: https://plugins.traefik.io/plugins/6335346ca4caa9ddeffda116/crowdsec-bouncer-traefik-plugin
    crowdsec-waf:
      plugin:
        crowdsec-bouncer:
          enabled: true
          # ℹ️ Supported log level: DEBUG, INFO, ERROR
          logLevel: INFO
          crowdsecMode: stream
          updateIntervalSeconds: 600
          # ℹ️ Never block traffic if LAPI is unreachable (fail-open)
          updateMaxFailure: -1
          metricsUpdateIntervalSeconds: 0
          # ℹ️ "waf" = Docker Compose service name, resolvable within the shared Docker network
          crowdsecLapiHost: "waf:8080"
          crowdsecLapiKey: "{{ env "CROWDSEC_BOUNCER_KEY" }}"
          crowdsecAppsecEnabled: true
          crowdsecAppsecHost: "waf:7422"
          # ℹ️ fail-open: requests pass through if AppSec returns error or is unreachable
          crowdsecAppsecFailureBlock: false
          crowdsecAppsecUnreachableBlock: false
          # ℹ️ Bypass CrowdSec checks for trusted local/Docker IPs
          clientTrustedIPs:
            # IPv4 - HOST
            - "127.0.0.1/32"
            - "192.168.0.0/16"
            - "172.16.0.0/12"
            # IPv6 - HOST
            - "::1/128"
            - "fe80::/10"
            - "fd00::/8"
            # EXTERNAL HOSTS
            # - ".../32"
