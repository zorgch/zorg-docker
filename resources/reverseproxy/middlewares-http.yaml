# traefik Middlewares for HTTP routes
# - More information: https://community.traefik.io/t/middleware-does-not-exist-but-it-is-defined/19253/8
http:
  middlewares:

    # Enable compression
    # - Use with: compress-gzip@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/compress/
    compress-gzip:
      compress: {}

    # Add MIME-Type Autodetection
    # - Use with: contenttype-add@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/contenttype/
    contenttype-add:
      contenttype: {}

    # Add security headers
    # - Use with: securityheaders-add@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/headers/
    securityheaders-add:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        accessControlMaxAge: 100
        addVaryHeader: true
        customFrameOptionsValue: SAMEORIGIN
        customResponseHeaders:
          Access-Control-Allow-Origin: "*"
          Sec-Fetch-Site: cross-site
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    # Rate limiting
    # - Use with: rate-limit@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/ratelimit/
    rate-limit:
      rateLimit:
        average: 100
        period: 5s
        burst: 200

    # Allowed IP-Whitelist CIDRs
    # 💡 Format: "192.168.1.7/32", "152.23.5.0/16"
    # - Use with: ip-whitelist@file
    # - Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/ipallowlist/
    ip-whitelist:
      ipAllowList:
        sourceRange:
          # IPv4 - HOST
          - "127.0.0.1/32"  # localhost
          - "172.16.0.0/12" # Docker bridge networks (172.16-172.31)
          # IPv6 - HOST
          - "::1/128"       # localhost
          - "fe80::/10"     # Docker Link-local
          - "fd00::/8"      # Docker IPv6 default range
          # EXTERNAL HOSTS
          # - ".../32"

    owasp-coraza-waf:
      plugin:
        coraza:
          directives:
            # Basic WAF Configuration (Optimized Order)

            # 1. Core Engine Settings (MUST come first)
            - SecRuleEngine On

            # 2. Data Storage (needed before any rules that use persistent storage)
            - SecDataDir /var/lib/coraza/
            - SecTmpDir /var/lib/coraza/tmp/      # Request body overflow (>5MB), multipart parsing
            - SecUploadKeepFiles Off              # Don't retain files (saves disk space)

            # 3. Request Body Handling (before audit settings that may log body data)
            - SecRequestBodyAccess On
            - SecRequestBodyLimit 52428800        # 50 MB max
            - SecRequestBodyInMemoryLimit 5242880 # 5 MB buffer (avoid disk writes for small requests)
            - SecRequestBodyLimitAction ProcessPartial

            # 4. Response Body Handling (optional - currently disabled)
            # Note: Enable only if you need to inspect response bodies (adds latency & memory overhead)
            #- SecResponseBodyAccess Off
            #- SecResponseBodyMimeType text/plain text/html text/xml
            #- SecResponseBodyLimit 524288         # 512 KB
            #- SecResponseBodyLimitAction ProcessPartial

            # 5. Audit Logging (should come after body settings to properly log configured data)
            - SecAuditEngine RelevantOnly
            - SecAuditLogType Serial
            - SecAuditLogFormat JSON
            - SecAuditLog /var/log/coraza/audit.log
            - SecAuditLogParts ABIJDEFHZ
            - SecAuditLogRelevantStatus "^(?:4|5)\\d{2}$"

            # 8. Collection Timeout (for IP reputation, rate limiting, etc.)
            - SecCollectionTimeout 300  # 5 minutes

            # 9. Argument Separator (for proper parsing of query strings)
            - SecArgumentSeparator &

            # OWASP Security Rules
            # [ How Rule IDs Affect Processing ]
            #  Uniqueness: IDs must be unique (which you already know)
            #  Processing Order: Rules are processed in the order they appear in the configuration, NOT by ID number
            #  Convention: IDs are typically used for organizational purposes and to follow CRS (Core Rule Set) conventions:
            #   1-99,999: Reserved for local custom rules
            #   100,000-199,999: Internal/initialization rules
            #   200,000-299,999: Protocol validation and anomaly scoring
            #   900,000-999,999: Initialization, whitelist, and housekeeping rules
            #
            #  Conclusion:
            #  -> Body parsers (200000-200002) must run in phase 1 before the body is needed
            #  -> Whitelists (900xxx) should run early to skip unnecessary processing
            #  -> Protocol validation (200010-200011) should run before attack detection
            #  -> Attack rules (200100+) run last in phase 2

            # (0) Initialization & Whitelist Rules (Phase 1)
            # -- Allow any incoming cookies (any name/value)
            - SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES "." "id:900100,phase:1,pass,nolog,msg:'Allow all cookies'"
            # -- Whitelist: Skip body inspection for static assets
            - SecRule REQUEST_URI "@rx \.(css|js|map|png|jpg|jpeg|gif|ico|svg|webp|avif|bmp|tiff|mp4|webm|ogg|mp3|wav|woff|woff2|ttf|eot|txt|pdf|br|gz|zip)$" "id:900110,phase:1,t:lowercase,pass,nolog,ctl:requestBodyAccess=Off,msg:'Skip body processing for static files'"

            # (1) Request Body Parsers (Phase 1 - Protocol Enforcement)
            # -- XML content type detection
            - SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML,msg:'Enable XML body parser'"

            # -- JSON content type detection (standard)
            - SecRule REQUEST_HEADERS:Content-Type "^application/json" "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON,msg:'Enable JSON body parser'"
            # -- JSON content type detection (vendor-specific)
            - SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" "id:200002,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON,msg:'Enable JSON body parser for vendor types'"

            # (2) Protocol Validation (Phase 2)
            # -- Request body parsing errors
            - SecRule REQBODY_ERROR "!@eq 0" "id:200010,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body',logdata:'%{reqbody_error_msg}',severity:2"
            # -- Multipart validation
            - SecRule MULTIPART_STRICT_ERROR "!@eq 0" "id:200011,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation',severity:2"

            # (3) Attack Detection (Phase 2)
            # -- XSS detection
            - SecRule ARGS "@contains <script" "id:200100,phase:2,t:lowercase,log,deny,status:403,msg:'XSS attempt detected',severity:2"
            # -- SQL injection detection
            - SecRule ARGS "@pm union select delete from drop table insert into" "id:200101,phase:2,t:lowercase,log,deny,status:403,msg:'SQL injection attempt detected',severity:2"
