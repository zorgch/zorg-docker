# CrowdSec Email Notification Plugin — Attack Digest
# Documentation: https://docs.crowdsec.net/docs/next/local_api/notification_plugins/email
#
# Sends an HTML email digest for larger/sustained attacks to developers and admins.
# Uses the internal Postfix SMTP service (postfix-smtp:25, no auth, no TLS) —
# matching the same setup used by the website/PHP container (see resources/website/sendmail/example-msmtprc).
#
# Reference in decision-profiles.yaml
# 👨‍🔬 Notification Test: `docker compose exec waf cscli notifications test email_summary`
type: email
name: email_summary

log_level: info

# -=[ Batching / Grouping ]=-
# group_wait:      collect for this long before sending one digest
# group_threshold: OR send immediately if this many alerts accumulate first
group_wait: 4h
group_threshold: 150

timeout: 20s

# -=[ Internal Postfix SMTP ]=-
# ℹ️ postfix-smtp is the Docker Compose service name, resolvable within the shared
#    information-superhighway network (same as website/PHP msmtp config).
# ℹ️ ${VAR} is expanded by CrowdSec at config load time (outside format block).
smtp_host: postfix-smtp
smtp_port: 25
auth_type: none
encryption_type: none

sender_name: "${DOCKER_STACK} CrowdSec WAF"
sender_email: ${CROWDSEC_ALERT_EMAIL_FROM}

email_subject: "[${DOCKER_STACK}] ⚔️ CrowdSec WAF — Attack Digest"

receiver_emails:
  - ${CROWDSEC_ALERT_EMAIL_TO}
# Add more receivers:
# - second@example.com

# -=[ Message Format ]=-
# HTML email body. Receives a list of models.Alert objects.
# - .Source.Value        : attacker IP (use Value for email — always populated)
# - .Source.Country      : GeoIP country (may be empty for private IPs)
# - .Scenario            : matched CrowdSec scenario
# - .Decisions[].Type    : remediation type
# - .Decisions[].Duration: remediation duration
# - .MachineID           : CrowdSec machine/node that generated the alert
format: |
  <html><body>
  <h2>{{ len . }} alerts</h2>
  <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:monospace;">
    <thead>
      <tr style="background:#f0f0f0;">
        <th>IP</th>
        <th>Country</th>
        <th>Scenario</th>
        <th>Decision</th>
        <th>Links</th>
      </tr>
    </thead>
    <tbody>
    {{range . -}}
      {{$alert := . -}}
      {{range .Decisions -}}
      <tr>
        <td><a href="https://www.whois.com/whois/{{.Value}}">{{.Value}}</a></td>
        <td>{{ $alert.Source.Cn }}</td>
        <td>{{.Scenario}}</td>
        <td>{{.Type}} for {{.Duration}}</td>
        <td>
          <a href="https://app.crowdsec.net/cti/{{.Value}}">CrowdSec CTI</a> |
          <a href="https://www.shodan.io/host/{{.Value}}">Shodan</a>
        </td>
      </tr>
      {{end -}}
    {{end -}}
    </tbody>
  </table>
  <p style="color:#888;font-size:0.9em;">Generated by {{ env "DOCKER_STACK" }} CrowdSec WAF on {{ now | date "2006-01-02 15:04:05" }} UTC</p>
  </body></html>
