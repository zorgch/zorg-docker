# CrowdSec AppSec Custom Rules
# Documentation: https://docs.crowdsec.net/docs/appsec/rules_syntax
#
# These rules are migrated from the previous Apache ModSecurity / Coraza WAF configuration.
# They block common malicious crawlers, bot exploit paths, and attack vectors.
#
# Rules here are applied in-band (blocking). Restart the crowdsec container to apply changes.
#
# To whitelist specific paths, add rules with a lower priority that pass before these rules fire.
# - FILE NAMING: Any *.yaml filename works — the filename is irrelevant to rule loading.
# - RULE NAMING: Each rule's `name:` field must start with "custom/" (e.g. custom/block-xyz)
#    so it is matched by the `custom/*` wildcard in appsec-config.yaml inband_rules.

---
# Block CGI-bin access attempts
name: custom/block-cgi-bin
description: "Block CGI-bin access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/cgi-bin/'

---
# Block shell script file access
name: custom/block-shell-scripts
description: "Block .sh file access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.sh(\?|$)'

---
# Block JSP file access (not used by this PHP site)
name: custom/block-jsp-files
description: "Block .jsp file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.jsp(\?|$)'

---
# Block ASP/ASPX file access (not used by this PHP site)
name: custom/block-asp-files
description: "Block .asp/.aspx file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.aspx?(\?|$)'

---
# Block database admin paths
name: custom/block-db-admin-paths
description: "Block database admin path access attempts (phpMyAdmin, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(phpmyadmin|phpMyAdmin|pma|mysql|myadmin|db|database)(/|$|\?)'

---
# Block sensitive config/hidden file access
name: custom/block-sensitive-files
description: "Block access to sensitive config and hidden files (.env, .git, .htaccess, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.(env|git|svn|htaccess|htpasswd|ini|log|bak|backup|old|sql)(\?|$)'

---
# Block WordPress exploit paths (this site does not run WordPress)
name: custom/block-wordpress-paths
description: "Block WordPress-specific exploit paths"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(wp-|wordpress/|wp-content|wp-includes|wp-admin|wp-login|xmlrpc\.php|wp-config)'

---
# Block common CMS/framework exploit paths (Drupal, Joomla, etc.)
name: custom/block-cms-paths
description: "Block common CMS and framework exploit paths"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(drupal|joomla|magento|typo3|laravel|codeigniter|symfony)(/|$|\?)'

---
# Block common admin panel paths
name: custom/block-admin-panels
description: "Block access to common admin panel paths"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(administrator|manager|webadmin|controlpanel|cpanel)(/|$|\?)'

# =============================================================================
# START CUSTOM WHITELISTING
# (Optionally: add separate *.yaml files )
#
# Add whitelist rules below with a name prefix of "custom/allow-"
# ℹ️ CrowdSec AppSec evaluates rules in alphabetical order by name.
#    Whitelist rule names starting with "custom/allow-" sort before "custom/block-"
#    (because 'a' < 'b') and will be evaluated first, allowing early pass decisions
#    to skip block rules. ⚠️ Do NOT use "custom/whitelist-" — 'w' > 'b', so those
#    names would sort AFTER block rules and the allow would never be reached.
# Example:
#   name: custom/allow-my-path
#   description: "Allow specific path"
#   rules:
#     - zones: [URI]
#       transform: [lowercase]
#       match:
#         type: startsWith
#         value: '/my-allowed-path/'
#   on_match:
#     - remediation: false
# END CUSTOM WHITELISTING
# =============================================================================
