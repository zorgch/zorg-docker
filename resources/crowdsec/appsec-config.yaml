# CrowdSec AppSec Configuration
# Documentation: https://docs.crowdsec.net/docs/appsec/intro
#
# Defines the Application Security (WAF) ruleset for real-time HTTP request inspection.
# This replaces the previous Apache ModSecurity / Coraza WAF configuration.
#
# Rules applied in-band (synchronous - can block requests):
#   - crowdsecurity/vpatch-*     : Virtual patches for known CVEs (OWASP-equivalent coverage)
#   - crowdsecurity/generic-*    : Generic attack detection (XSS, SQLi, path traversal, etc.)
#   - zorg/block-*               : Custom bot/crawler blocking rules (see appsec-rules/ directory)
#
# Rules applied out-of-band (asynchronous - log/detect only, no blocking):
#   - crowdsecurity/crs-*        : Full OWASP Core Rule Set (detection mode, no false-positive risk)
#
# ℹ️ To add custom whitelists or modify blocking rules, edit:
#    resources/crowdsec/appsec-rules/zorg-custom-rules.yaml
#    A Docker Compose restart is required to apply rule changes.

name: zorg/appsec-config
description: "zorg WAF - OWASP virtual patching, generic attack detection + custom bot/crawler blocking"

default_remediation: ban
default_pass_action: allow
block_http_code: 403
pass_http_code: 200
error_http_code: 500

# In-band rules: evaluated synchronously - can block requests before they reach the application
inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-rules-*
  - zorg/block-*

# Out-of-band rules: evaluated asynchronously - detect only, no blocking (safe for full CRS)
outofband_rules:
  - crowdsecurity/crs-*
