# CrowdSec AppSec Custom Rules - zorg Website
# Documentation: https://docs.crowdsec.net/docs/appsec/rules_syntax
#
# These rules are migrated from the previous Apache ModSecurity / Coraza WAF configuration.
# They are split into two sections:
#   1. ALLOW / WHITELIST rules  (zorg/allow-*)  — evaluated FIRST, permit specific patterns
#   2. BLOCK rules              (zorg/block-*)  — block malicious crawlers, bots, exploit paths
#
# ℹ️ Evaluation order: rules are processed in the order listed in appsec-config.yaml.
#    "zorg/allow-*" is listed before "zorg/block-*" in the config, so allow rules run first.
#    When an allow rule matches (on_match: allow: true), further evaluation is short-circuited
#    and the request is passed through without being blocked.
# ℹ️ Edit this file and restart the crowdsec container to apply changes.

# =============================================================================
# ALLOW / WHITELIST RULES
# Migrated from Coraza WAF (originally in resources/reverseproxy/middlewares-http.yaml
# "Initialization & Whitelist Rules" section, rules id:90000 and id:900110).
# =============================================================================

---
# Allow all incoming cookie values through WAF inspection without blocking
# Migrated from Coraza rule id:90000:
#   SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES "." "id:90000,phase:1,pass,nolog,msg:'Allow all cookies'"
#
# ⚠️ This is a broad allow rule for the COOKIES zone. It prevents blocking based on cookie
#    content alone. Requests are still inspected by URI and ARGS zone rules.
#    If specific cookies are known to carry legitimate content that triggers false positives
#    (e.g. base64-encoded values that match SQLi patterns), keep this rule enabled.
#    To tighten security, remove this rule and instead add targeted zorg/allow-custom-* rules
#    for specific cookie names below (in the CUSTOM WHITELISTING section).
name: zorg/allow-all-cookies
description: "Allow all cookie values (prevent false-positive blocking on cookie content)"
rules:
  - zones:
      - COOKIES
    match:
      type: regex
      value: '.*'
on_match:
  - allow: true

---
# Allow static asset file extension requests to bypass WAF inspection
# Migrated from Coraza rule id:900110:
#   SecRule REQUEST_URI "@rx \.(css|js|...)$" "id:900110,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
#
# Static assets (images, stylesheets, fonts, media files) never carry attack payloads
# and skipping WAF inspection for them reduces latency and false-positive risk.
name: zorg/allow-static-files
description: "Skip WAF inspection for static asset file extension requests (CSS, JS, images, fonts, media, etc.)"
rules:
  - zones:
      - URI
    transform:
      - lowercase
    match:
      type: regex
      value: '\.(css|js|map|png|jpg|jpeg|gif|ico|svg|webp|avif|bmp|tiff|mp4|webm|ogg|mp3|wav|woff|woff2|ttf|eot|txt|pdf|br|gz|zip)(\?.*)?$'
on_match:
  - allow: true

# =============================================================================
# BLOCK RULES
# Block common malicious crawlers, bot exploit paths, and attack vectors.
# =============================================================================

---
# Block CGI-bin access attempts
name: zorg/block-cgi-bin
description: "Block CGI-bin access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/cgi-bin/'

---
# Block shell script file access
name: zorg/block-shell-scripts
description: "Block .sh file access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.sh(\?|$)'

---
# Block JSP file access (not used by this PHP site)
name: zorg/block-jsp-files
description: "Block .jsp file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.jsp(\?|$)'

---
# Block ASP/ASPX file access (not used by this PHP site)
name: zorg/block-asp-files
description: "Block .asp/.aspx file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.aspx?(\?|$)'

---
# Block database admin paths
name: zorg/block-db-admin-paths
description: "Block database admin path access attempts (phpMyAdmin, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(phpmyadmin|phpMyAdmin|pma|mysql|myadmin|db|database)(/|$|\?)'

---
# Block sensitive config/hidden file access
name: zorg/block-sensitive-files
description: "Block access to sensitive config and hidden files (.env, .git, .htaccess, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.(env|git|svn|htaccess|htpasswd|ini|log|bak|backup|old|sql)(\?|$)'

---
# Block WordPress exploit paths (this site does not run WordPress)
name: zorg/block-wordpress-paths
description: "Block WordPress-specific exploit paths (not applicable to this site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(wp-|wordpress/|wp-content|wp-includes|wp-admin|wp-login|xmlrpc\.php|wp-config)'

---
# Block common CMS/framework exploit paths (Drupal, Joomla, etc.)
name: zorg/block-cms-paths
description: "Block common CMS and framework exploit paths (not applicable to this site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(drupal|joomla|magento|typo3|laravel|codeigniter|symfony)(/|$|\?)'

---
# Block common admin panel paths
name: zorg/block-admin-panels
description: "Block access to common admin panel paths"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(administrator|manager|webadmin|controlpanel|cpanel)(/|$|\?)'

# =============================================================================
# CUSTOM WHITELISTING
# Add site-specific allow rules below using the "zorg/allow-custom-" name prefix.
# ℹ️ "zorg/allow-*" names sort alphabetically before "zorg/block-*" (a < b),
#    so all allow rules are evaluated before block rules as long as they are
#    listed under zorg/allow-* in appsec-config.yaml → inband_rules.
# Example:
#   name: zorg/allow-custom-my-path
#   description: "Allow specific path"
#   rules:
#     - zones: [URI]
#       transform: [lowercase]
#       match:
#         type: startsWith
#         value: '/my-allowed-path/'
#   on_match:
#     - allow: true
# =============================================================================
