# CrowdSec AppSec Custom Rules - zorg Website
# Documentation: https://docs.crowdsec.net/docs/appsec/rules_syntax
#
# These rules are migrated from the previous Apache ModSecurity / Coraza WAF configuration.
# They block common malicious crawlers, bot exploit paths, and attack vectors.
#
# Rule naming convention: zorg/block-<category>
# ℹ️ Rules here are applied in-band (blocking). Edit and restart the crowdsec container to apply changes.
# ℹ️ To whitelist specific paths, add rules with a lower priority that pass before these rules fire.

---
# Block CGI-bin access attempts
name: zorg/block-cgi-bin
description: "Block CGI-bin access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/cgi-bin/'

---
# Block shell script file access
name: zorg/block-shell-scripts
description: "Block .sh file access attempts (common exploit/scanner target)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.sh(\?|$)'

---
# Block JSP file access (not used by this PHP site)
name: zorg/block-jsp-files
description: "Block .jsp file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.jsp(\?|$)'

---
# Block ASP/ASPX file access (not used by this PHP site)
name: zorg/block-asp-files
description: "Block .asp/.aspx file access attempts (not applicable to PHP site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.aspx?(\?|$)'

---
# Block database admin paths
name: zorg/block-db-admin-paths
description: "Block database admin path access attempts (phpMyAdmin, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(phpmyadmin|phpMyAdmin|pma|mysql|myadmin|db|database)(/|$|\?)'

---
# Block sensitive config/hidden file access
name: zorg/block-sensitive-files
description: "Block access to sensitive config and hidden files (.env, .git, .htaccess, etc.)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '\.(env|git|svn|htaccess|htpasswd|ini|log|bak|backup|old|sql)(\?|$)'

---
# Block WordPress exploit paths (this site does not run WordPress)
name: zorg/block-wordpress-paths
description: "Block WordPress-specific exploit paths (not applicable to this site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(wp-|wordpress/|wp-content|wp-includes|wp-admin|wp-login|xmlrpc\.php|wp-config)'

---
# Block common CMS/framework exploit paths (Drupal, Joomla, etc.)
name: zorg/block-cms-paths
description: "Block common CMS and framework exploit paths (not applicable to this site)"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(drupal|joomla|magento|typo3|laravel|codeigniter|symfony)(/|$|\?)'

---
# Block common admin panel paths
name: zorg/block-admin-panels
description: "Block access to common admin panel paths"
rules:
  - zones:
      - URI
    transform:
      - urldecode
      - lowercase
    match:
      type: regex
      value: '/(administrator|manager|webadmin|controlpanel|cpanel)(/|$|\?)'

# =============================================================================
# START CUSTOM WHITELISTING
# Add whitelist rules below with a name prefix of "zorg/whitelist-"
# ℹ️ CrowdSec AppSec evaluates rules in alphabetical order by name.
#    Whitelist rule names starting with "zorg/whitelist-" sort before "zorg/block-"
#    and will be evaluated first, allowing early pass decisions to skip block rules.
# Example:
#   name: zorg/whitelist-my-path
#   description: "Allow specific path"
#   rules:
#     - zones: [URI]
#       transform: [lowercase]
#       match:
#         type: startsWith
#         value: '/my-allowed-path/'
#   on_match:
#     - remediation: false
# END CUSTOM WHITELISTING
# =============================================================================
