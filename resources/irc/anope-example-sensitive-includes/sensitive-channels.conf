# Example configuration for registering and protecting IRC channels with ChanServ
# Replace values in quotes with your actual data

# Main Community Channel Example
chanserv {
    name = "#welcome"              # Your main community channel
    founder = "netadmin"            # Primary network admin username
    successor = "serveradmin"       # Backup admin username
    mlock = "+n"                   # Channel modes (n=no external msgs, t=topic protection)
    flags = "KEEPTOPIC SECURE GUARD PERSIST NOEXPIRE"

    # Channel access permissions
    access {
        nick = "serveradmin"
        flags = "+*" # All permissions
    }
    access {
        nick = "netadmin"
        flags = "+*" # All permissions
    }
}

# Staff Channel Example
chanserv {
    name = "#secret"                # Private staff/admin channel
    founder = "serveradmin"         # Primary channel owner username
    successor = "netadmin"          # Backup owner username
    mlock = "+nt"                   # Channel modes (n=no external msgs, t=topic protection)
    flags = "KEEPTOPIC SECURE GUARD TOPICLOCK PERSIST NOEXPIRE PRIVATE"

    # Channel access permissions
    access {
        nick = "serveradmin"
        flags = "+*" # All permissions
    }
    access {
        nick = "netadmin"
        flags = "+voOt" # Op + topic control
    }
}

# Bot-Managed Channel Example
chanserv {
    name = "#botchannel"            # Channel managed by a bot
    founder = "botuser"             # Bot's username
    successor = "serveradmin"       # Human backup owner
    mlock = "+nt"                   # Channel modes (n=no external msgs, t=topic protection)
    flags = "KEEPTOPIC SECURE GUARD TOPICLOCK"

    # Channel access permissions
    access {
        nick = "botuser"
        flags = "+*Aqf" # EVERYTHING + auto-op + founder protection
    }
}
