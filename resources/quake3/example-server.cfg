// --==[ Server settings ]==--
sets "Administrator" "zorg Verein"
sets "Location" "Switzerland (CH)"
sets "URL" "https://zorg.ch"
sets sv_hostname "^7[^1z^7]^3fraggeria"
set g_motd \"Welcome to zorg.ch frag-fest. Happy fragging!\"
set dedicated 2     // 1 = connect by IP (LAN focused), 2 = Announce to Master-Server (public Internet)
set sv_public 1     // 0 = private server, 1 = public server
set sv_timeout 120
set sv_maxclients 23
set g_allowVote 1

// --==[ Network settings ]==--
set net_enabled 1
set net_noipx 1
set net_socksEnabled 0
set com_hunkmegs 64
set sv_fps 40
set sv_allowDownload 0
set sv_dlURL ""

// --==[ Requirements for connecting Clients ]==--
set sv_privateClients 0
set sv_pure 0
set g_smoothclients 1
set g_inactivity 300
set sv_zombietime 3

// --==[ Logging ]==--
set g_log_stats 1
set g_log "logs/zfraggeria_server.log"
set g_logsync 1

// --==[ Bot settings ]==--
set bot_enable 0
set bot_nochat 1
set g_spskill 4

// --==[ Game settings ]==--
set g_gameType 0
set dmflags 0
set g_fraglimit 17
set g_timelimit 23
set g_dowarmup 5
set g_teamautojoin 1
set g_teamforcebalance 1
set g_forcerespawn 0
set g_weaponrespawn 5

// --==[ Scripted mapcycle & map start ]==--
writeconfig q3config
set playmap1 "g_gametype 0 ; fraglimit 17 ; timelimit 23 ; map q3dm6 ; set nextmap vstr playmap2"
set playmap2 "g_gametype 0 ; fraglimit 17 ; timelimit 23 ; map q3dm7 ; set nextmap vstr playmap3"
set playmap3 "g_gametype 0 ; fraglimit 17 ; timelimit 23 ; map q3dm17 ; set nextmap vstr playmap4"
set playmap4 "g_gametype 0 ; fraglimit 17 ; timelimit 23 ; map q3dm3 ; set nextmap vstr playmap5"
set playmap5 "g_gametype 0 ; fraglimit 17 ; timelimit 23 ; map q3dm13 ; set nextmap vstr playmap1"
vstr playmap1
