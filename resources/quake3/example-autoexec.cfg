// Server settings
seta sv_hostname "^7[^1z^7] ^3fraggeria"
set g_motd \"Welcome to zorg.ch frag-fest. Happy fragging!\"
set dedicated 2

// Network settings
set net_enabled 1
set net_noipx 1
set net_socksEnabled 0
seta sv_public 0
seta sv_privateClients 0
set sv_pure 0
set sv_allowDownload 0
set sv_dlURL ""
seta sv_fps 40
seta com_hunkmegs 128

// Game settings
seta g_gameType 0
seta g_fraglimit 15
seta g_timelimit 20
seta g_mapcycle "q3dm6 q3dm7 q3dm17 q3dm3 q3dm13"
seta sv_maxclients 23
seta g_allowVote 1
set bot_enable 0
seta g_forcerespawn 0
seta g_inactivity 300000

// Logging
set g_log_stats 1
seta g_log "logs/zfraggeria_server.log"
seta g_logsync 1
