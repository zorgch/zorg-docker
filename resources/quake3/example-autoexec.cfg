// Server settings
seta sv_hostname "^7[^1z^7] ^3fraggeria"
seta g_motd \"Welcome to zorg.ch frag-fest. Happy fragging!\"
sets "Administrator" "zorg Verein"
sets "Location" "Switzerland"
sets "URL" "https://zorg.ch"

// Network settings
set net_enabled 1
set net_noipx 1
set net_socksEnabled 0
seta com_hunkmegs 128
seta sv_allowDownload 0
seta sv_dlURL ""
seta sv_fps 40
seta sv_privateClients 0
seta sv_public 0
seta sv_pure 0

// Game settings
set dedicated 2
seta sv_maxclients 23
seta bot_enable 0
seta g_gameType 0
seta g_allowVote 1
seta g_fraglimit 15
seta g_timelimit 20
seta g_mapcycle "q3dm6 q3dm7 q3dm17 q3dm3 q3dm13"
seta g_mapcycle_shuffle 1
seta g_forcerespawn 0
seta g_weaponrespawn 5
seta g_inactivity 300000

// Logging
seta g_log_stats 1
seta g_log "logs/zfraggeria_server.log"
seta g_logsync 1
